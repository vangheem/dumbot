[package]
name = "dumbot"
version = "0.1.0"
edition = "2024"
description = "Self-rewriting markdown bots that run on a schedule through opencode"
license = "MIT"
repository = "https://github.com/vangheem/dumbot"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rune = { git = "https://github.com/vangheem/rune", rev = "ee055d312ad958f937fa715616e336bfabce2f09" }
rune-kit = { git = "https://github.com/vangheem/rune", rev = "ee055d312ad958f937fa715616e336bfabce2f09", features = ["markdown"] }
rune-theme-opencode = { git = "https://github.com/vangheem/rune", rev = "ee055d312ad958f937fa715616e336bfabce2f09" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

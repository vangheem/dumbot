[package]
name = "dumbot"
version = "0.3.0"
edition = "2024"
description = "Self-rewriting markdown bots that run on a schedule through opencode"
license = "MIT"
repository = "https://github.com/vangheem/dumbot"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rcgen = "0.13"
ring = "0.17"
rune = { optional = true, git = "https://github.com/anomalyco/rune", rev = "e98ea23b788069dcf5327d71a4507ce1a9404bbe", features = ["native-file-dialog"] }
rune-kit = { optional = true, git = "https://github.com/anomalyco/rune", rev = "e98ea23b788069dcf5327d71a4507ce1a9404bbe", features = ["markdown"] }
rune-theme-opencode = { optional = true, git = "https://github.com/anomalyco/rune", rev = "e98ea23b788069dcf5327d71a4507ce1a9404bbe" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[features]
default = ["gui"]
# The desktop app. Without it, dumbot is only the command line bots use inside their
# containers.
gui = ["dep:rune", "dep:rune-kit", "dep:rune-theme-opencode"]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "e98ea23b788069dcf5327d71a4507ce1a9404bbe" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "e98ea23b788069dcf5327d71a4507ce1a9404bbe" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "e98ea23b788069dcf5327d71a4507ce1a9404bbe" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "e98ea23b788069dcf5327d71a4507ce1a9404bbe" }
naga = { git = "https://github.com/anomalyco/rune", rev = "e98ea23b788069dcf5327d71a4507ce1a9404bbe" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "e98ea23b788069dcf5327d71a4507ce1a9404bbe" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "e98ea23b788069dcf5327d71a4507ce1a9404bbe" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "e98ea23b788069dcf5327d71a4507ce1a9404bbe" }
